        function renderTable(data) {
            const tbody = document.getElementById('clinic-list-body');
            tbody.innerHTML = '';

            data.forEach((clinic) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-200";

                let logoHtml = '';
                if (clinic.logo) {
                    logoHtml = `<img src="${clinic.logo}" alt="${clinic.name} 로고" class="max-h-10 max-w-[70px] object-contain mx-auto" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-16 h-9 rounded logo-placeholder flex items-center justify-center text-slate-400 text-xs mx-auto\'><i class=\'fa-regular fa-hospital text-slate-300\'></i></div>'">`;

                    logoHtml = `
                        <div class="w-16 h-9 rounded logo-placeholder flex items-center justify-center text-slate-400 text-xs mx-auto" title="로고 이미지 공간">
                            <i class="fa-regular fa-hospital text-slate-300"></i>
                        </div>
                    `;
                }

                let websiteHtml = '';
                if (clinic.website) {
                    websiteHtml = `
                        <a href="${clinic.website}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 rounded transition-colors">

                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    `;
                } else {
                    websiteHtml = `<span class="text-slate-300 text-xs">-</span>`;
                }

                tr.innerHTML = `
                    <td class="py-2.5 px-4 text-center align-middle border-r border-slate-200">${logoHtml}</td>
                    <td class="py-2.5 px-4 font-semibold text-slate-900 align-middle border-r border-slate-200">${clinic.name}</td>
                    <td class="py-2.5 px-4 text-slate-600 align-middle border-r border-slate-200">${clinic.address}</td>

                    <td class="py-2.5 px-4 text-center align-middle">${websiteHtml}</td>
